<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8">
    <title>Регистрация</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Навигационное меню -->
    <nav class="menu">

        <a href="index.html">
            На главную
        </a>

        <a href="form.html">
            Регистрация
        </a>

    </nav>


    <!-- Заголовок -->
    <h1>Регистрация</h1>


    <form>

        <!-- Текст -->
        <p>
            <label>
                Имя:
                <input
                    type="text"
                    name="name"
                >
            </label>
        </p>


        <!-- Email -->
        <p>
            <label>
                Email:
                <input
                    type="email"
                    name="email"
                >
            </label>
        </p>


        <!-- Пароль -->
        <p>
            <label>
                Пароль:
                <input
                    type="password"
                    name="password"
                >
            </label>
        </p>


        <!-- Изображение -->
        <p>
            <label>
                Изображение:
                <input
                    type="file"
                    name="image"
                >
            </label>
        </p>


        <!-- Радиокнопки -->
        <p>
            Пол:
        </p>

        <p>
            <label>
                <input
                    type="radio"
                    name="gender"
                    value="male"
                >
                Мужской
            </label>
        </p>

        <p>
            <label>
                <input
                    type="radio"
                    name="gender"
                    value="female"
                >
                Женский
            </label>
        </p>


        <!-- Чекбокс -->
        <p>
            <label>
                <input
                    type="checkbox"
                    name="mailing"
                >
                Согласен на получение рассылки
            </label>
        </p>


        <!-- Кнопка отправки -->
        <p>
            <input
                type="submit"
                value="Зарегистрироваться"
            >
        </p>

    </form>


    <!-- Ссылка на главную -->
    <p>
        <a href="index.html">
            Вернуться на главную
        </a>
    </p>

</body>

</html>
